services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: smartpos-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ""
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - codebridge-network

networks:
  codebridge-network:
    name: codebridge-network
    external: true
