name: codebridge-prod

services:

  # 1. Nginx Proxy Manager (Public TLS/SSL Terminator & Host Router)
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: codebridge-prod-npm
    restart: always
    ports:
      - "80:80"       # Public HTTP Traffic (Cloudflare -> NPM)
      - "81:81"       # Admin Web Dashboard (Restrict via firewall or SSH tunnel)
      - "443:443"     # Public HTTPS Traffic (Let's Encrypt / Cloudflare Full Strict)
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - prod-npm-data:/data
      - prod-npm-letsencrypt:/etc/letsencrypt
    networks:
      - codebridge-prod-network

  # 2. Internal API Gateway (WAF, Rate Limiter, FastCGI Dispatcher)
  # NPM routes https://codebridge-api.servicefixit.me -> http://codebridge-prod-gateway:80
  # NPM routes https://codebridge-docs.servicefixit.me -> http://codebridge-prod-gateway:80
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: codebridge-prod-gateway
    restart: always
    expose:
      - "80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/services:/etc/nginx/services:ro
      - ./gateway/docs.html:/usr/share/nginx/html/docs.html:ro
    depends_on:
      - auth-service
      - operations-service
    networks:
      codebridge-prod-network:
        aliases:
          - api-gateway
          - codebridge-api-gateway

  # 3. Auth & Identity PHP-FPM Service (Production)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-service
    restart: always
    env_file:
      - ./env/production/auth.env
    expose:
      - "9000"
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      codebridge-prod-network:
        aliases:
          - auth-service
          - codebridge-auth-service

  auth-horizon:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-horizon
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    restart: always
    env_file:
      - ./env/production/auth.env
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-network

  auth-scheduler:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    restart: always
    env_file:
      - ./env/production/auth.env
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-network

  auth-mysql:
    image: mysql:8.4
    container_name: codebridge-prod-auth-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_MYSQL_DATABASE}
      MYSQL_USER: ${AUTH_MYSQL_USER}
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD}
    volumes:
      - prod-auth-mysql-data:/var/lib/mysql
    networks:
      codebridge-prod-network:
        aliases:
          - auth-mysql
          - codebridge-auth-mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUTH_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  auth-redis:
    image: redis:8-alpine
    container_name: codebridge-prod-auth-redis
    restart: always
    command: redis-server --requirepass ${AUTH_REDIS_PASSWORD}
    volumes:
      - prod-auth-redis-data:/data
    networks:
      codebridge-prod-network:
        aliases:
          - auth-redis
          - codebridge-auth-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTH_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Operations PHP-FPM Service (Production)
  operations-service:
    build:
      context: ./operations-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-operations-service
    restart: always
    env_file:
      - ./env/production/operations.env
    expose:
      - "9000"
    depends_on:
      operations-mysql:
        condition: service_healthy
      operations-redis:
        condition: service_healthy
    networks:
      codebridge-prod-network:
        aliases:
          - operations-service
          - codebridge-operations-service

  operations-horizon:
    build:
      context: ./operations-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-operations-horizon
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    restart: always
    env_file:
      - ./env/production/operations.env
    depends_on:
      operations-mysql:
        condition: service_healthy
      operations-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-network

  operations-mysql:
    image: mysql:8.4
    container_name: codebridge-prod-operations-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${OPERATIONS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OPERATIONS_MYSQL_DATABASE}
      MYSQL_USER: ${OPERATIONS_MYSQL_USER}
      MYSQL_PASSWORD: ${OPERATIONS_MYSQL_PASSWORD}
    volumes:
      - prod-operations-mysql-data:/var/lib/mysql
    networks:
      codebridge-prod-network:
        aliases:
          - operations-mysql
          - codebridge-operations-mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${OPERATIONS_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  operations-redis:
    image: redis:8-alpine
    container_name: codebridge-prod-operations-redis
    restart: always
    command: redis-server --requirepass ${OPERATIONS_REDIS_PASSWORD}
    volumes:
      - prod-operations-redis-data:/data
    networks:
      codebridge-prod-network:
        aliases:
          - operations-redis
          - codebridge-operations-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${OPERATIONS_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Production MinIO S3 Object Storage (CDN Backend)
  # NPM routes https://codebridge-cdn.servicefixit.me -> http://codebridge-prod-minio:9000
  minio:
    image: minio/minio:latest
    container_name: codebridge-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - prod-minio-data:/data
    networks:
      codebridge-prod-network:
        aliases:
          - minio
          - codebridge-minio
          - s3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: alpine:latest
    container_name: codebridge-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - prod-minio-data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/codebridge-auth-prod/avatars /data/codebridge-operations-prod/products
        chmod -R 777 /data
        echo 'Production MinIO buckets initialized.'
        exit 0
    networks:
      - codebridge-prod-network

networks:
  codebridge-prod-network:
    name: codebridge-prod-network
    driver: bridge

volumes:
  prod-npm-data:
  prod-npm-letsencrypt:
  prod-auth-mysql-data:
  prod-auth-redis-data:
  prod-operations-mysql-data:
  prod-operations-redis-data:
  prod-minio-data:
