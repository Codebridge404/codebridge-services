name: codebridge-prod

services:

  # ============================================================================
  # 1. Edge Ingress: Nginx Proxy Manager (Public Entrypoint: 80 / 443)
  # Routes public domain https://codebridge-api.servicefixit.me to active slot:
  #   - Blue Active:  forward to http://codebridge-prod-blue-gateway:80
  #   - Green Active: forward to http://codebridge-prod-green-gateway:80
  # ============================================================================
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: codebridge-prod-npm
    restart: always
    ports:
      - "80:80"       # Public HTTP Traffic (Cloudflare -> NPM)
      - "81:81"       # Admin Web Dashboard (Restrict via firewall or SSH tunnel)
      - "443:443"     # Public HTTPS Traffic (Let's Encrypt / Cloudflare Full Strict)
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - prod-npm-data:/data
      - prod-npm-letsencrypt:/etc/letsencrypt
    networks:
      - codebridge-prod-proxy-network

  # ============================================================================
  # 2. BLUE DEPLOYMENT SLOT (Slot A)
  # ============================================================================
  gateway-blue:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: codebridge-prod-blue-gateway
    restart: always
    expose:
      - "80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/services:/etc/nginx/services:ro
      - ./gateway/docs.html:/usr/share/nginx/html/docs.html:ro
    depends_on:
      - auth-service-blue
      - operations-service-blue
    networks:
      codebridge-prod-proxy-network:
        aliases:
          - codebridge-prod-blue-gateway
      codebridge-prod-blue-network:
        aliases:
          - api-gateway
          - codebridge-api-gateway

  auth-service-blue:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-blue
    restart: always
    env_file:
      - ./env/production/auth.env
    expose:
      - "9000"
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      codebridge-prod-blue-network:
        aliases:
          - auth-service
          - codebridge-auth-service
      codebridge-prod-data-network:
        aliases:
          - auth-service-blue

  operations-service-blue:
    build:
      context: ./operations-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-operations-blue
    restart: always
    env_file:
      - ./env/production/operations.env
    expose:
      - "9000"
    depends_on:
      operations-mysql:
        condition: service_healthy
      operations-redis:
        condition: service_healthy
    networks:
      codebridge-prod-blue-network:
        aliases:
          - operations-service
          - codebridge-operations-service
      codebridge-prod-data-network:
        aliases:
          - operations-service-blue

  auth-horizon-blue:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-horizon-blue
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    restart: always
    env_file:
      - ./env/production/auth.env
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-data-network

  operations-horizon-blue:
    build:
      context: ./operations-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-operations-horizon-blue
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    restart: always
    env_file:
      - ./env/production/operations.env
    depends_on:
      operations-mysql:
        condition: service_healthy
      operations-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-data-network

  # ============================================================================
  # 3. GREEN DEPLOYMENT SLOT (Slot B)
  # ============================================================================
  gateway-green:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: codebridge-prod-green-gateway
    restart: always
    expose:
      - "80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/services:/etc/nginx/services:ro
      - ./gateway/docs.html:/usr/share/nginx/html/docs.html:ro
    depends_on:
      - auth-service-green
      - operations-service-green
    networks:
      codebridge-prod-proxy-network:
        aliases:
          - codebridge-prod-green-gateway
      codebridge-prod-green-network:
        aliases:
          - api-gateway
          - codebridge-api-gateway

  auth-service-green:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-green
    restart: always
    env_file:
      - ./env/production/auth.env
    expose:
      - "9000"
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      codebridge-prod-green-network:
        aliases:
          - auth-service
          - codebridge-auth-service
      codebridge-prod-data-network:
        aliases:
          - auth-service-green

  operations-service-green:
    build:
      context: ./operations-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-operations-green
    restart: always
    env_file:
      - ./env/production/operations.env
    expose:
      - "9000"
    depends_on:
      operations-mysql:
        condition: service_healthy
      operations-redis:
        condition: service_healthy
    networks:
      codebridge-prod-green-network:
        aliases:
          - operations-service
          - codebridge-operations-service
      codebridge-prod-data-network:
        aliases:
          - operations-service-green

  auth-horizon-green:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-horizon-green
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    restart: always
    env_file:
      - ./env/production/auth.env
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-data-network

  operations-horizon-green:
    build:
      context: ./operations-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-operations-horizon-green
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    restart: always
    env_file:
      - ./env/production/operations.env
    depends_on:
      operations-mysql:
        condition: service_healthy
      operations-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-data-network

  # ============================================================================
  # 4. SINGLETON WORKER: Production Laravel Cron Scheduler
  # Executes schedule:run on the active slot network to prevent duplicate crons
  # ============================================================================
  auth-scheduler:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codebridge-prod-auth-scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    restart: always
    env_file:
      - ./env/production/auth.env
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - codebridge-prod-data-network

  # ============================================================================
  # 5. SHARED PRODUCTION PERSISTENCE & DATA SERVICES
  # Both Blue and Green slots connect to these shared data instances
  # ============================================================================
  auth-mysql:
    image: mysql:8.4
    container_name: codebridge-prod-auth-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_MYSQL_DATABASE}
      MYSQL_USER: ${AUTH_MYSQL_USER}
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD}
    volumes:
      - prod-auth-mysql-data:/var/lib/mysql
    networks:
      codebridge-prod-data-network:
        aliases:
          - auth-mysql
          - codebridge-auth-mysql-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUTH_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  auth-redis:
    image: redis:8-alpine
    container_name: codebridge-prod-auth-redis
    restart: always
    command: redis-server --requirepass ${AUTH_REDIS_PASSWORD}
    volumes:
      - prod-auth-redis-data:/data
    networks:
      codebridge-prod-data-network:
        aliases:
          - auth-redis
          - codebridge-auth-redis-prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTH_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  operations-mysql:
    image: mysql:8.4
    container_name: codebridge-prod-operations-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${OPERATIONS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OPERATIONS_MYSQL_DATABASE}
      MYSQL_USER: ${OPERATIONS_MYSQL_USER}
      MYSQL_PASSWORD: ${OPERATIONS_MYSQL_PASSWORD}
    volumes:
      - prod-operations-mysql-data:/var/lib/mysql
    networks:
      codebridge-prod-data-network:
        aliases:
          - operations-mysql
          - codebridge-operations-mysql-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${OPERATIONS_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  operations-redis:
    image: redis:8-alpine
    container_name: codebridge-prod-operations-redis
    restart: always
    command: redis-server --requirepass ${OPERATIONS_REDIS_PASSWORD}
    volumes:
      - prod-operations-redis-data:/data
    networks:
      codebridge-prod-data-network:
        aliases:
          - operations-redis
          - codebridge-operations-redis-prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${OPERATIONS_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: codebridge-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - prod-minio-data:/data
    networks:
      codebridge-prod-proxy-network:
        aliases:
          - codebridge-prod-minio
      codebridge-prod-data-network:
        aliases:
          - minio
          - codebridge-minio-prod
          - s3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: alpine:latest
    container_name: codebridge-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - prod-minio-data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/codebridge-auth-prod/avatars /data/codebridge-operations-prod/products
        chmod -R 777 /data
        echo 'Production MinIO buckets initialized.'
        exit 0
    networks:
      - codebridge-prod-data-network

# ==============================================================================
# NETWORKS: Isolated Blue, Isolated Green, Shared Proxy, and Shared Data
# ==============================================================================
networks:
  # Public ingress proxy network (NPM <-> Blue Gateway & Green Gateway & MinIO)
  codebridge-prod-proxy-network:
    name: codebridge-prod-proxy-network
    driver: bridge

  # Isolated Blue internal network (Blue Gateway <-> Blue Auth & Blue Ops)
  codebridge-prod-blue-network:
    name: codebridge-prod-blue-network
    driver: bridge

  # Isolated Green internal network (Green Gateway <-> Green Auth & Green Ops)
  codebridge-prod-green-network:
    name: codebridge-prod-green-network
    driver: bridge

  # Protected data network (MySQL, Redis, MinIO <-> Auth & Ops containers)
  codebridge-prod-data-network:
    name: codebridge-prod-data-network
    driver: bridge

# ==============================================================================
# PERSISTENT STORAGE VOLUMES
# ==============================================================================
volumes:
  prod-npm-data:
  prod-npm-letsencrypt:
  prod-auth-mysql-data:
  prod-auth-redis-data:
  prod-operations-mysql-data:
  prod-operations-redis-data:
  prod-minio-data:
