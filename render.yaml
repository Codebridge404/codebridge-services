services:
  # ============================================================================
  # 1. Nginx API Gateway (Public Web Service)
  # ============================================================================
  - type: web
    name: codebridge-api-gateway
    env: docker
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt # Or oregon / singapore (match your TiDB Cloud region)
    envVars:
      - key: PORT
        value: 80

  # ============================================================================
  # 2. Auth & Identity Service (Private Service)
  # ============================================================================
  - type: pserv
    name: auth-service
    env: docker
    dockerfilePath: ./docker/Dockerfile.cloud
    dockerContext: .
    dockerBuildArgs:
      - key: SERVICE_DIR
        value: ./auth-service
    plan: free
    region: frankfurt
    envVars:
      - key: APP_NAME
        value: "CodeBridge Auth & Identity Service"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false # Set to your TiDB Cloud Host in Render Dashboard (e.g. gateway01.<region>.prod.aws.tidbcloud.com)
      - key: DB_PORT
        value: "4000" # TiDB Cloud default port
      - key: DB_DATABASE
        value: codebridge
      - key: DB_USERNAME
        sync: false # Set to your TiDB Cloud User (e.g. <prefix>.root)
      - key: DB_PASSWORD
        sync: false # Set to your TiDB Cloud Password
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

  # ============================================================================
  # 3. Operations, Inventory, Shifts & Commerce Engine (Private Service)
  # ============================================================================
  - type: pserv
    name: operations-service
    env: docker
    dockerfilePath: ./docker/Dockerfile.cloud
    dockerContext: .
    dockerBuildArgs:
      - key: SERVICE_DIR
        value: ./operations-service
    plan: free
    region: frankfurt
    envVars:
      - key: APP_NAME
        value: "CodeBridge Operations Service"
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: codebridge
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

