services:
  phpmyadmin:
    image: phpmyadmin:5
    container_name: ${PMA_CONTAINER_NAME:-codebridge-staging-phpmyadmin}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8085}:80"
    dns:
      - 10.43.0.10
      - 8.8.8.8
    environment:
      PMA_HOSTS: "auth-mysql.codebridge-staging.svc.cluster.local,operations-mysql.codebridge-staging.svc.cluster.local"
      PMA_VERBOSES: "Auth Service Database,Operations Service Database"
      UPLOAD_LIMIT: 128M
      MEMORY_LIMIT: 256M
    networks:
      codebridge-staging-network:
        aliases:
          - phpmyadmin
          - codebridge-phpmyadmin
          - codebridge-staging-phpmyadmin

networks:
  codebridge-staging-network:
    external: true
