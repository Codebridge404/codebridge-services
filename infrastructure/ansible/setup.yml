---
- name: Prepare basic packages on an existing CodeBridge VPS
  hosts: codebridge
  become: true
  tasks:
    - name: Install basic packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/codebridge
        state: directory
        owner: root
        group: root
        mode: "0755"
