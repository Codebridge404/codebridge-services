services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: codebridge-nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'       # Public HTTP Traffic (Cloudflare -> NPM)
      - '81:81'       # Admin Web Management Dashboard (Default login: admin@example.com / changeme)
      - '443:443'     # Public HTTPS Traffic (Let's Encrypt / Cloudflare Full Strict)
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - codebridge-network
      - codebridge-staging-network
      - codebridge-prod-blue-net
      - codebridge-prod-green-net

networks:
  codebridge-network:
    name: codebridge-network
  codebridge-staging-network:
    name: codebridge-staging-network
  codebridge-prod-blue-net:
    name: codebridge-prod-blue-net
  codebridge-prod-green-net:
    name: codebridge-prod-green-net
