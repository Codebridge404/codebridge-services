user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

# ==============================================================================
# TCP STREAM LAYER: Forwards Gateway FastCGI (Port 9000) to Active Blue/Green Slot
# ==============================================================================
stream {
    include /etc/nginx/bluegreen/active-stream.conf;

    server {
        listen 9000;
        proxy_pass auth_fpm_stream;
        proxy_timeout 120s;
        proxy_connect_timeout 5s;
    }
}

# ==============================================================================
# HTTP LAYER: Direct HTTP Reverse Proxy / Health Check
# ==============================================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Upload file size limit (avatars, documents, logos)
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Load dynamic HTTP upstream definition (swapped between blue and green)
    include /etc/nginx/bluegreen/active-upstream.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        add_header X-Auth-Color $auth_active_color always;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Global Proxy / FastCGI health check
        location = /health {
            access_log off;
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass auth_backend;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param REQUEST_URI /api/v1/health;
        }

        # Static file handling
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Pass PHP scripts to the active Blue/Green upstream
        location ~ \.php$ {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass auth_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        }

        # Deny access to hidden files (.env, .git, etc.)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
