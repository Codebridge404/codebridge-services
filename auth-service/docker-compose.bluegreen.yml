name: codebridge-auth-bluegreen

services:
  # ==============================================================================
  # NGINX REVERSE PROXY / TRAFFIC SWITCHER (Blue/Green Gateway)
  # ==============================================================================
  auth-proxy:
    image: nginx:1.27-alpine
    container_name: codebridge-auth-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    expose:
      - "9000"
    volumes:
      - ./deploy/bluegreen/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/bluegreen/nginx/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
      - ./deploy/bluegreen/nginx:/etc/nginx/bluegreen:ro
    depends_on:
      - auth-service-blue
    networks:
      auth-bluegreen-net:
      codebridge-network:
        aliases:
          - auth-service

  # ==============================================================================
  # BLUE ENVIRONMENT (Slot A) - Immutable Release Image
  # ==============================================================================
  auth-service-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: codebridge-auth-service:blue
    container_name: codebridge-auth-blue
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "9000"
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - auth-bluegreen-net

  auth-horizon-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: codebridge-auth-service:blue
    container_name: codebridge-auth-horizon-blue
    restart: unless-stopped
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - auth-bluegreen-net

  # ==============================================================================
  # GREEN ENVIRONMENT (Slot B) - Immutable Release Image
  # ==============================================================================
  auth-service-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: codebridge-auth-service:green
    container_name: codebridge-auth-green
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "9000"
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - auth-bluegreen-net

  auth-horizon-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: codebridge-auth-service:green
    container_name: codebridge-auth-horizon-green
    restart: unless-stopped
    command: sh -c "if php artisan list | grep -q 'horizon'; then exec php artisan horizon; else exec php artisan queue:work --tries=3 --timeout=90; fi"
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      auth-mysql:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - auth-bluegreen-net

  auth-scheduler:
    image: codebridge-auth-service:${AUTH_ACTIVE_COLOR:-blue}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ${ENV_FILE:-.env}
    networks:
      - auth-bluegreen-net

  # ==============================================================================
  # PERSISTENT STATEFUL INFRASTRUCTURE (Shared between Blue & Green)
  # ==============================================================================
  auth-mysql:
    image: mysql:8.4
    container_name: codebridge-auth-mysql-bg
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-codebridge_auth}
      MYSQL_USER: ${DB_USERNAME:-codebridge_auth}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD must be set in .env}}
    ports:
      - "${MYSQL_BIND_PORT:-127.0.0.1:3307}:3306"
    volumes:
      - auth-mysql-bg-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - auth-bluegreen-net

  auth-redis:
    image: redis:8-alpine
    container_name: codebridge-auth-redis-bg
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
      '
    ports:
      - "${REDIS_BIND_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - auth-redis-bg-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ] && [ \"$$REDIS_PASSWORD\" != \"null\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - auth-bluegreen-net

  minio:
    image: minio/minio:latest
    container_name: codebridge-auth-minio-bg
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - auth-minio-bg-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - auth-bluegreen-net

  minio-init:
    image: alpine:latest
    container_name: codebridge-auth-minio-init-bg
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - auth-minio-bg-data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/codebridge-auth/avatars
        chmod -R 777 /data
        echo 'MinIO avatars bucket initialized.'
        exit 0
    networks:
      - auth-bluegreen-net

  # ==============================================================================
  # DEMO PROFILE SERVICES (Activated only with --profile demo)
  # ==============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: codebridge-auth-mailpit-bg
    restart: unless-stopped
    profiles:
      - demo
    ports:
      - "${MAILPIT_SMTP_PORT:-127.0.0.1:1025}:1025"
      - "${MAILPIT_HTTP_PORT:-127.0.0.1:8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ""
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    networks:
      - auth-bluegreen-net

  auth-phpmyadmin:
    image: phpmyadmin:5
    container_name: codebridge-auth-phpmyadmin-bg
    restart: unless-stopped
    profiles:
      - demo
    ports:
      - "${PMA_PORT:-127.0.0.1:8081}:80"
    environment:
      PMA_HOST: auth-mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      auth-mysql:
        condition: service_healthy
    networks:
      - auth-bluegreen-net

networks:
  auth-bluegreen-net:
    name: auth-bluegreen-net
    driver: bridge
  codebridge-network:
    name: codebridge-network
    external: true

volumes:
  auth-mysql-bg-data:
  auth-redis-bg-data:
  auth-minio-bg-data:

