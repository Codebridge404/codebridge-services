# Example Kubernetes Secret manifest.
# Copy this file to k8s/secret.yaml (gitignored), replace every CHANGE_ME_* value
# with cryptographically random production secrets, and apply via Kustomize or SealedSecrets/ExternalSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: codebridge
type: Opaque
stringData:
  # Laravel Application Encryption Key (generate: php artisan key:generate --show)
  APP_KEY: "base64:CHANGE_ME_GENERATE_32_BYTE_BASE64_APP_KEY="

  # Production JWT Secret (minimum 64 random characters recommended)
  JWT_SECRET: "CHANGE_ME_GENERATE_AT_LEAST_64_CHARACTER_RANDOM_JWT_SECRET_VALUE"

  # MySQL Credentials
  DB_PASSWORD: "CHANGE_ME_MYSQL_APP_PASSWORD"
  DB_ROOT_PASSWORD: "CHANGE_ME_MYSQL_ROOT_PASSWORD"

  # Redis Credentials (required in shared/production clusters)
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

  # MinIO S3 Credentials
  MINIO_ROOT_USER: "CHANGE_ME_MINIO_ACCESS_KEY"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_MINIO_SECRET_KEY"

