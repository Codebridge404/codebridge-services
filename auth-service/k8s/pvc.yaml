apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-mysql-pvc
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-mysql
    app.kubernetes.io/part-of: codebridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-redis-pvc
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-minio-pvc
  namespace: codebridge
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: codebridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

