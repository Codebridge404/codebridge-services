apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: codebridge
type: Opaque
stringData:
  # Laravel Application Encryption Key
  APP_KEY: "base64:7GZ5+uQ/s7N3xLgW+tEw1PqY7UoVn9iKm4jRt2v8xLg="

  # Production JWT Secret (Minimum 32 characters)
  JWT_SECRET: "codebridge_auth_k8s_production_jwt_secret_must_be_32_characters_minimum!"

