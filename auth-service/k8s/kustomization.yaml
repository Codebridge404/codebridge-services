apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codebridge

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - mysql.yaml
  - redis.yaml
  - minio.yaml
  - auth-nginx-configmap.yaml
  - auth-deployment.yaml
  - auth-service.yaml
  - horizon-deployment.yaml
  - scheduler-cronjob.yaml
  - ingress.yaml
  - gateway.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: codebridge
