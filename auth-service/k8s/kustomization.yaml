apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codebridge

# Note: Secrets are intentionally excluded from Kustomize so untracked plaintext
# secret.yaml files are never required for CI validation (apply secret.yaml
# separately via k8s/deploy.sh, SealedSecrets, or ExternalSecrets).
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - mysql.yaml
  - redis.yaml
  - minio.yaml
  - auth-nginx-configmap.yaml
  - auth-deployment.yaml
  - auth-service.yaml
  - horizon-deployment.yaml
  - scheduler-cronjob.yaml
  - ingress.yaml
  - gateway.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: codebridge
