apiVersion: v1
kind: Service
metadata:
  name: operations-service
  namespace: codebridge
  labels:
    app.kubernetes.io/name: operations-service
    app.kubernetes.io/part-of: codebridge
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: fastcgi
  selector:
    app.kubernetes.io/name: operations-service
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: codebridge
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: codebridge
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app.kubernetes.io/name: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: codebridge
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: codebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      containers:
        - name: gateway
          image: codebridge-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /docs
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
