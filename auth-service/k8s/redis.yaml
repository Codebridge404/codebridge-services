apiVersion: v1
kind: Service
metadata:
  name: auth-redis
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: auth-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-redis
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              if [ -n "${REDIS_PASSWORD:-}" ] && [ "${REDIS_PASSWORD:-}" != "null" ]; then
                exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
              else
                exec redis-server --appendonly yes
              fi
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if [ -n "${REDIS_PASSWORD:-}" ] && [ "${REDIS_PASSWORD:-}" != "null" ]; then
                    redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep -q PONG
                  else
                    redis-cli ping | grep -q PONG
                  fi
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if [ -n "${REDIS_PASSWORD:-}" ] && [ "${REDIS_PASSWORD:-}" != "null" ]; then
                    redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep -q PONG
                  else
                    redis-cli ping | grep -q PONG
                  fi
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: auth-redis-pvc

