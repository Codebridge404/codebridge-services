apiVersion: v1
kind: Service
metadata:
  name: auth-redis
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: auth-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-redis
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: auth-redis-pvc

