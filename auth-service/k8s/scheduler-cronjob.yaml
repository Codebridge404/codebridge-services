apiVersion: batch/v1
kind: CronJob
metadata:
  name: auth-scheduler
  namespace: codebridge
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: auth-scheduler
            app.kubernetes.io/part-of: codebridge
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduler
              image: codebridge-auth-service:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 33
                runAsGroup: 33
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command: ["php", "artisan", "schedule:run"]
              envFrom:
                - configMapRef:
                    name: auth-configmap
                - secretRef:
                    name: auth-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
