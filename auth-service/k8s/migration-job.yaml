apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migration-job
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-migration
    app.kubernetes.io/part-of: codebridge
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for auth-mysql:3306..."
              until nc -z -v -w3 auth-mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 3
              done
              echo "MySQL is reachable!"
      containers:
        - name: artisan-migrate
          image: codebridge-auth-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command:
            - php
            - artisan
            - migrate
            - --force
          envFrom:
            - configMapRef:
                name: auth-configmap
            - secretRef:
                name: auth-secret

