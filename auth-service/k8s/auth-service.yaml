apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: codebridge
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: codebridge
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
    - port: 9000
      targetPort: 9000
      name: fastcgi
      protocol: TCP
  selector:
    app.kubernetes.io/name: auth-service

