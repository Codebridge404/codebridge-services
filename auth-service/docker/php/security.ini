; ==============================================================================
; CodeBridge Hardened PHP Security Configuration
; Mitigations for PHP2Shell (CVE-2026-109618, CVE-2026-109619) & Attack Surface
; ==============================================================================

; Disable session upload progress mechanism (neutralizes CVE-2026-109619 UAF vector)
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On

; Disable PHP version exposure in HTTP response headers
expose_php = Off

; Suppress error display to prevent information disclosure
display_errors = Off
display_startup_errors = Off
log_errors = On

; Disable remote code inclusion
allow_url_include = Off

; Session cookie security
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
