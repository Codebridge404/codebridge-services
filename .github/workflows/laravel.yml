name: Laravel Microservices CI

on:
  push:
    branches: [ "master", "main", "demo", "front-develop", "feature/**" ]
  pull_request:
    branches: [ "master", "main", "demo" ]

jobs:
  build-and-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - operations-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql, bcmath, zip, sockets
          coverage: none

      - name: Setup & Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          JWT_SECRET: testing_jwt_secret_key_minimum_32_characters_long_for_security
          JWT_ISSUER: codebridge-auth-service
          JWT_ALGO: HS256
        run: |
          if [ -f "composer.json" ]; then
            echo "Installing dependencies for ${{ matrix.service }}..."
            cp .env.example .env 2>/dev/null || true
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan key:generate 2>/dev/null || true
            mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            touch database/database.sqlite
            chmod -R 777 storage bootstrap/cache database
            php artisan test --env=testing
          fi
