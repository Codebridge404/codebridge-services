name: Deploy Staging Full Infrastructure (K3s)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Shared infrastructure component to roll out on K3s staging"
        required: true
        type: choice
        default: "full-k3s-stack"
        options:
          - "full-k3s-stack"
          - "gateway-only"

concurrency:
  group: staging-k3s-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # EXPLICIT MANUAL FULL INFRASTRUCTURE DEPLOYMENT (K3S)
  # --------------------------------------------------------------------------
  deploy-infra:
    name: Deploy Shared Infrastructure to K3s
    if: github.ref == 'refs/heads/demo'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Shared Infrastructure via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_COMPONENT: ${{ github.event.inputs.target }}
          TARGET_SHA: ${{ github.sha }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH || '/opt/codebridge-services/codebridge-services' }}
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          port: ${{ secrets.STAGING_VPS_PORT || 22 }}
          fingerprint: ${{ secrets.STAGING_VPS_FINGERPRINT || '' }}
          command_timeout: 30m
          timeout: 60s
          envs: TARGET_COMPONENT,TARGET_SHA,STAGING_DEPLOY_PATH
          script: |
            set -euo pipefail

            echo "=========================================================================="
            echo "Starting K3s Shared Infrastructure Staging Deployment"
            echo "  Target Component: ${TARGET_COMPONENT}"
            echo "  Commit Revision : ${TARGET_SHA}"
            echo "=========================================================================="

            LOCK_FILE="/tmp/codebridge-staging-deploy.lock"
            exec 200>"${LOCK_FILE}"
            echo "Acquiring VPS deployment lock..."
            flock -w 600 200

            TARGET_DIR="${STAGING_DEPLOY_PATH:-/opt/codebridge-services/codebridge-services}"
            if [ ! -d "${TARGET_DIR}/.git" ]; then
              echo "ERROR: Tracked repository directory not found at ${TARGET_DIR}." >&2
              exit 1
            fi

            cd "${TARGET_DIR}"
            echo "Working directory: $(pwd)"

            # Ensure clean tracked working tree
            if ! git diff-index --quiet HEAD --; then
              echo "ERROR: Tracked files have uncommitted changes on VPS. Aborting." >&2
              exit 1
            fi

            echo "Fetching latest demo branch..."
            git fetch origin demo
            git checkout "${TARGET_SHA}"

            echo "Applying Kubernetes manifests in k8s/staging/..."
            if [ -n "${KUBECONFIG:-}" ] && [ -r "${KUBECONFIG}" ]; then
              export KUBECONFIG
            else
              for candidate in "${HOME}/.kube/config" /home/deploy/.kube/config /etc/rancher/k3s/k3s.yaml; do
                if [ -r "$candidate" ]; then
                  export KUBECONFIG="$candidate"
                  break
                fi
              done
            fi

            kubectl apply -k k8s/staging/
            kubectl -n codebridge-staging rollout status deployment/gateway --timeout=180s

            echo "✔ Shared infrastructure deployment to K3s completed successfully."
