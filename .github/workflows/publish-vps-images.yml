name: Publish VPS images (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, operations, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 images for this exact commit
        env:
          SERVICE: ${{ matrix.service }}
          OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/${OWNER,,}"
          release="sha-${GITHUB_SHA:0:12}"
          bash deploy/scripts/build.sh "$SERVICE" "$registry" "$release"
          printf 'Published %s images with tag %s\n' "$SERVICE" "$release" >> "$GITHUB_STEP_SUMMARY"
