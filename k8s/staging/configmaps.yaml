apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: codebridge
data:
  APP_NAME: "CodeBridge Auth (Staging)"
  APP_ENV: "staging"
  APP_DEBUG: "false"
  APP_URL: "https://staging-codebridge-api.servicefixit.me"
  FRONTEND_URL: "https://staging.codebridge.servicefixit.me"
  API_BASE_URL: "https://staging-codebridge-api.servicefixit.me/api/v1"
  DOCS_URL: "https://staging-codebridge-docs.servicefixit.me"
  CDN_URL: "https://staging-codebridge-cdn.servicefixit.me"
  EVENTS_URL: "https://staging-codebridge-events.servicefixit.me"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  BCRYPT_ROUNDS: "12"

  # Database & Cache hostnames resolve via K8s Services
  DB_CONNECTION: "mysql"
  DB_HOST: "auth-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "codebridge_auth_staging"
  DB_USERNAME: "codebridge_auth_user"

  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "auth-redis"
  REDIS_PORT: "6379"

  # S3 MinIO Object Storage
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: "codebridge-auth-staging"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_URL: "https://staging-codebridge-cdn.servicefixit.me/codebridge-auth-staging"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  JWT_ISSUER: "codebridge-auth-service"
  JWT_ACCESS_TTL: "15"
  JWT_REFRESH_TTL: "43200"
  JWT_ALGO: "HS256"

  REVERB_APP_ID: "codebridge-staging-app"
  REVERB_SERVER_HOST: "0.0.0.0"
  REVERB_SERVER_PORT: "8080"
  REVERB_HOST: "staging-codebridge-events.servicefixit.me"
  REVERB_PORT: "443"
  REVERB_SCHEME: "https"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-config
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: operations-service
    app.kubernetes.io/part-of: codebridge
data:
  APP_NAME: "CodeBridge Operations (Staging)"
  APP_ENV: "staging"
  APP_DEBUG: "false"
  APP_URL: "https://staging-codebridge-api.servicefixit.me"
  FRONTEND_URL: "https://staging.codebridge.servicefixit.me"
  API_BASE_URL: "https://staging-codebridge-api.servicefixit.me/api/v1"
  DOCS_URL: "https://staging-codebridge-docs.servicefixit.me"
  CDN_URL: "https://staging-codebridge-cdn.servicefixit.me"
  EVENTS_URL: "https://staging-codebridge-events.servicefixit.me"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  BCRYPT_ROUNDS: "12"

  # Database & Cache hostnames resolve via K8s Services
  DB_CONNECTION: "mysql"
  DB_HOST: "operations-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "codebridge_operations_staging"
  DB_USERNAME: "codebridge_ops_user"

  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "operations-redis"
  REDIS_PORT: "6379"

  # S3 MinIO Object Storage
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: "codebridge-operations-staging"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_URL: "https://staging-codebridge-cdn.servicefixit.me/codebridge-operations-staging"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  JWT_ISSUER: "codebridge-auth-service"
  JWT_ALGO: "HS256"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: codebridge
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout 65;
        client_max_body_size 64M;
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        # Upstream microservices resolve via Kubernetes ClusterIP Services (Port 9000)
        upstream auth_service {
            server auth-service.codebridge-staging.svc.cluster.local:9000;
        }

        upstream operations_service {
            server operations-service.codebridge-staging.svc.cluster.local:9000;
        }

        # Real IP configuration for Cloudflare & Traefik Ingress
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        server {
            listen 80;
            server_name _;

            # Health Check Endpoint
            location = /api/v1/health {
                fastcgi_pass auth_service;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
                fastcgi_param SCRIPT_NAME /index.php;
                fastcgi_param REQUEST_URI $request_uri;
                include fastcgi_params;
            }

            # Auth Service Routes
            location /api/v1/auth {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/me {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/users {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/roles {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/permissions {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/suppliers {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/customers {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/outlets {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/departments {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }

            # Operations Service Routes
            location /api/v1/operations {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/products {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/categories {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/orders {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/shifts {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/pos {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/inventory {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }

            # Fallback root route
            location / {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
        }
    }

  fastcgi_php.conf: |
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param DOCUMENT_URI $document_uri;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param REMOTE_PORT $remote_port;
    fastcgi_param SERVER_ADDR $server_addr;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_TENANT_ID $http_x_tenant_id;
    fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;
    fastcgi_connect_timeout 10s;
    include fastcgi_params;

