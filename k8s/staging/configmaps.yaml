apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: codebridge
data:
  APP_NAME: "CodeBridge Auth (Staging)"
  APP_ENV: "staging"
  APP_DEBUG: "false"
  APP_URL: "https://staging-codebridge-api.servicefixit.me"
  FRONTEND_URL: "https://staging.codebridge.servicefixit.me"
  API_BASE_URL: "https://staging-codebridge-api.servicefixit.me/api/v1"
  DOCS_URL: "https://staging-codebridge-docs.servicefixit.me"
  CDN_URL: "https://staging-codebridge-cdn.servicefixit.me"
  EVENTS_URL: "https://staging-codebridge-events.servicefixit.me"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  BCRYPT_ROUNDS: "12"
  CORS_ALLOWED_ORIGINS: "https://staging-codebridge-docs.servicefixit.me,https://staging-codebridge-api.servicefixit.me,https://staging-codebridge.servicefixit.me,https://staging.codebridge.servicefixit.me,http://localhost:3000,http://localhost:5173,http://localhost:8080"

  # Database & Cache hostnames resolve via K8s Services
  DB_CONNECTION: "mysql"
  DB_HOST: "auth-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "codebridge_auth_staging"
  DB_USERNAME: "codebridge_auth_user"

  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "auth-redis"
  REDIS_PORT: "6379"

  # S3 MinIO Object Storage
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: "codebridge-auth-staging"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_URL: "https://staging-codebridge-cdn.servicefixit.me/codebridge-auth-staging"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  JWT_ISSUER: "codebridge-auth-service"
  JWT_ACCESS_TTL: "15"
  JWT_REFRESH_TTL: "43200"
  JWT_ALGO: "HS256"

  REVERB_APP_ID: "codebridge-staging-app"
  REVERB_SERVER_HOST: "0.0.0.0"
  REVERB_SERVER_PORT: "8080"
  REVERB_HOST: "staging-codebridge-events.servicefixit.me"
  REVERB_PORT: "443"
  REVERB_SCHEME: "https"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-config
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: operations-service
    app.kubernetes.io/part-of: codebridge
data:
  APP_NAME: "CodeBridge Operations (Staging)"
  APP_ENV: "staging"
  APP_DEBUG: "false"
  APP_URL: "https://staging-codebridge-api.servicefixit.me"
  FRONTEND_URL: "https://staging.codebridge.servicefixit.me"
  API_BASE_URL: "https://staging-codebridge-api.servicefixit.me/api/v1"
  DOCS_URL: "https://staging-codebridge-docs.servicefixit.me"
  CDN_URL: "https://staging-codebridge-cdn.servicefixit.me"
  EVENTS_URL: "https://staging-codebridge-events.servicefixit.me"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  BCRYPT_ROUNDS: "12"
  CORS_ALLOWED_ORIGINS: "https://staging-codebridge-docs.servicefixit.me,https://staging-codebridge-api.servicefixit.me,https://staging-codebridge.servicefixit.me,https://staging.codebridge.servicefixit.me,http://localhost:3000,http://localhost:5173,http://localhost:8080"

  # Database & Cache hostnames resolve via K8s Services
  DB_CONNECTION: "mysql"
  DB_HOST: "operations-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "codebridge_operations_staging"
  DB_USERNAME: "codebridge_ops_user"

  # Cross-Service Auth Database Connection
  AUTH_DB_HOST: "auth-mysql"
  AUTH_DB_PORT: "3306"
  AUTH_DB_DATABASE: "codebridge_auth_staging"
  AUTH_DB_USERNAME: "codebridge_auth_user"

  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "operations-redis"
  REDIS_PORT: "6379"

  # S3 MinIO Object Storage
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: "codebridge-operations-staging"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_URL: "https://staging-codebridge-cdn.servicefixit.me/codebridge-operations-staging"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  JWT_ISSUER: "codebridge-auth-service"
  JWT_ALGO: "HS256"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: codebridge
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout 65;
        client_max_body_size 64M;
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        # Upstream microservices resolve via Kubernetes ClusterIP Services (Port 9000)
        upstream auth_service {
            server auth-service.codebridge-staging.svc.cluster.local:9000;
        }

        upstream operations_service {
            server operations-service.codebridge-staging.svc.cluster.local:9000;
        }

        # Real IP configuration for Cloudflare & Traefik Ingress
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # WAF & Security Layer: Scanner & Exploit Tools Blocker
        map $http_user_agent $bad_client {
            default 0;
            ~*(?i)(sqlmap|nikto|gobuster|dirbuster|ffuf|wpscan|masscan|zgrab|hydra|medusa) 1;
            ~*(?i)(crackql|batchql|graphqlmap|clairvoyance|inql) 1;
            ~*(?i)(acunetix|nessus|openvas|qualys|netsparker|burpcollaborator) 1;
        }

        # HTTPS scheme detection behind Traefik & Cloudflare reverse proxies
        map $http_x_forwarded_proto $fastcgi_https {
            default $https;
            https   on;
        }

        server {
            listen 80;
            server_name _;

            # Hardened Security Headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # 1. Block Known Attacker Tools & Vulnerability Scanners
            if ($bad_client = 1) {
                return 403 '{"status":"error","code":"SECURITY_WAF_BLOCKED","message":"Access Denied: Malicious scanner or exploit tool signature detected."}\n';
            }

            # 2. Block GraphQL Probes & Mass ATO Batching Endpoints
            location ~* ^/(graphql|graphiql|altair|playground|__graphql|api/graphql)(\/|$) {
                default_type application/json;
                return 403 '{"status":"error","code":"GRAPHQL_ATO_PROTECTED","message":"GraphQL introspection and batch query endpoints are strictly disabled to prevent Mass Account Takeover."}\n';
            }

            # 3. Block PHP2Shell (CVE-2026-109618 / CVE-2026-109619) Exploit Payloads
            if ($query_string ~* "(PHP_SESSION_UPLOAD_PROGRESS|session\.upload_progress|upload_progress_)") {
                return 403 '{"status":"error","code":"PHP2SHELL_EXPLOIT_BLOCKED","message":"Access Denied: PHP2Shell exploit signature detected and blocked."}\n';
            }

            # 4. Block Direct WebShell & Backup Script Probes
            location ~* \.(php_bak|bak|old|orig|save|swp|sh|bash|env)$ {
                deny all;
                return 404;
            }

            # Redirect docs subdomains root to interactive documentation hub
            if ($host ~* "^(staging-)?codebridge-docs\.servicefixit\.me$") {
                rewrite ^/$ /docs permanent;
            }

            # Gateway Root Index
            location = / {
                add_header Access-Control-Allow-Origin * always;
                default_type application/json;
                return 200 '{"status":"healthy","gateway":"nginx","system":"CodeBridge Multi-Tenant Platform","environment":"staging","docs":"/docs","health":"/api/v1/health"}\n';
            }

            # Health Check Endpoints
            location = /health {
                add_header Access-Control-Allow-Origin * always;
                default_type application/json;
                return 200 '{"status":"healthy","gateway":"nginx","security":"waf_active","system":"CodeBridge@ Multi-Tenant Enterprise Platform"}\n';
            }

            location = /api/v1/health {
                add_header Access-Control-Allow-Origin * always;
                default_type application/json;
                return 200 '{"status":"healthy","gateway":"nginx","security":"waf_active","system":"CodeBridge@ Multi-Tenant Enterprise Platform"}\n';
            }

            # Central Interactive Documentation Hub
            location = /docs {
                alias /usr/share/nginx/html/docs.html;
                default_type text/html;
            }
            location = /docs/ {
                alias /usr/share/nginx/html/docs.html;
                default_type text/html;
            }
            location /docs/api {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location = /docs/api.json {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "*" always;
                if ($request_method = OPTIONS) { return 204; }
                include /etc/nginx/fastcgi_php.conf;
                fastcgi_pass auth_service;
            }
            location /docs/auth {
                include /etc/nginx/fastcgi_php.conf;
                fastcgi_param REQUEST_URI /docs/api;
                fastcgi_pass auth_service;
            }
            location = /docs/operations/api.json {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "*" always;
                if ($request_method = OPTIONS) { return 204; }
                include /etc/nginx/fastcgi_php.conf;
                fastcgi_param REQUEST_URI /docs/api.json;
                fastcgi_pass operations_service;
            }
            location /docs/operations {
                include /etc/nginx/fastcgi_php.conf;
                fastcgi_param REQUEST_URI /docs/api;
                fastcgi_pass operations_service;
            }
            location /docs/inventory {
                include /etc/nginx/fastcgi_php.conf;
                fastcgi_param REQUEST_URI /docs/api;
                fastcgi_pass operations_service;
            }
            location /docs/sales {
                include /etc/nginx/fastcgi_php.conf;
                fastcgi_param REQUEST_URI /docs/api;
                fastcgi_pass operations_service;
            }

            # Auth Service Routes
            location /api/v1/auth {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/me {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/users {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/roles {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/permissions {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/suppliers {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/customers {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/outlets {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/departments {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }

            # Operations Service Routes
            location /api/v1/operations {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/products {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/categories {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/orders {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/shifts {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/pos {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }
            location /api/v1/inventory {
                fastcgi_pass operations_service;
                include /etc/nginx/fastcgi_php.conf;
            }

            # Fallback root route
            location / {
                fastcgi_pass auth_service;
                include /etc/nginx/fastcgi_php.conf;
            }
        }
    }

  fastcgi_php.conf: |
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param DOCUMENT_URI $document_uri;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param REMOTE_PORT $remote_port;
    fastcgi_param SERVER_ADDR $server_addr;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param HTTPS $fastcgi_https if_not_empty;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_TENANT_ID $http_x_tenant_id;
    fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;
    fastcgi_connect_timeout 10s;
    include fastcgi_params;


  docs.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>CodeBridge@ — Multi-Tenant Enterprise API Gateway</title>
      <!-- Stoplight Elements (Same engine as Laravel Scramble) -->
      <script src="https://unpkg.com/@stoplight/elements/web-components.min.js"></script>
      <link rel="stylesheet" href="https://unpkg.com/@stoplight/elements/styles.min.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
      <style>
        * { box-sizing: border-box; }
        body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          width: 100%;
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
          display: flex;
          flex-direction: column;
          background: #0f172a;
          overflow: hidden;
        }
        .gateway-nav {
          height: 60px;
          min-height: 60px;
          background: #090d16;
          border-bottom: 1px solid #1e293b;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 24px;
          z-index: 100;
        }
        .brand {
          display: flex;
          align-items: center;
          gap: 12px;
          color: #f8fafc;
          font-size: 16px;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .brand-badge {
          background: linear-gradient(135deg, #3b82f6, #6366f1);
          color: #ffffff;
          font-size: 11px;
          font-weight: 700;
          padding: 3px 8px;
          border-radius: 6px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }
        .selector-box {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .selector-label {
          color: #94a3b8;
          font-size: 13px;
          font-weight: 600;
        }
        .service-select {
          background: #1e293b;
          color: #f1f5f9;
          border: 1px solid #334155;
          padding: 8px 16px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          outline: none;
          transition: all 0.2s ease;
          box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .service-select:hover, .service-select:focus {
          border-color: #3b82f6;
          background: #243248;
        }
        .docs-container {
          flex: 1;
          height: calc(100vh - 60px);
          background: #ffffff;
          overflow: hidden;
          position: relative;
        }
        elements-api {
          height: 100%;
          width: 100%;
          display: block;
        }
      </style>
    </head>
    <body>
      <header class="gateway-nav">
        <div class="brand">
          <span>🌉 CodeBridge@ Multi-Tenant</span>
          <span class="brand-badge">Enterprise Gateway</span>
        </div>
        <div class="selector-box">
          <label class="selector-label" for="serviceSelect">Service Definition:</label>
          <select id="serviceSelect" class="service-select" onchange="switchService(this.value)">
            <option value="/docs/api.json">🔑 Auth, RBAC, CRM & MMS Meeting Service</option>
            <option value="/docs/operations/api.json">📦 Operations, Inventory, Shifts & Commerce Engine</option>
          </select>
        </div>
      </header>
    
      <main class="docs-container" id="docsWrapper">
        <elements-api id="elementsDoc" apiDescriptionUrl="/docs/api.json" router="hash" layout="sidebar"></elements-api>
      </main>
    
      <script>
        // Universal Fetch Interceptor for Interactive Documentation
        // 1. Intercepts OpenAPI spec requests (/docs/api.json & /docs/operations/api.json) to prioritize live staging HTTPS/Current Origin servers
        // 2. Intercepts "Try It" API calls to rewrite localhost:8080 to current origin when running remotely
        // 3. Upgrades any insecure http:// calls to https:// to prevent Mixed Content blocking

        const originalFetch = window.fetch;
        window.fetch = async function(resource, init) {
          let url = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');

          // Sanitize API request targets
          if (url) {
            // Rewrite localhost:8080 to current origin if viewing from a remote domain
            if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
              if (url.startsWith('http://localhost:8080') || url.startsWith('http://127.0.0.1:8080')) {
                url = url.replace(/^http:\/\/(localhost|127\.0\.0\.1):8080/, window.location.origin);
              }
            }

            // Upgrade http:// to https:// when page is running over https
            if (window.location.protocol === 'https:' && url.startsWith('http://')) {
              url = url.replace(/^http:\/\//, 'https://');
            }

            if (url !== (typeof resource === 'string' ? resource : (resource ? resource.url : ''))) {
              if (typeof resource === 'string') {
                resource = url;
              } else {
                resource = new Request(url, resource);
              }
            }
          }

          const response = await originalFetch.call(this, resource, init);

          // Dynamically enhance OpenAPI specifications so Stoplight Elements always defaults to a reachable HTTPS server
          if (url && (url.endsWith('/api.json') || url.includes('/docs/api.json') || url.includes('/docs/operations/api.json'))) {
            try {
              const clone = response.clone();
              const spec = await clone.json();
              if (spec && spec.servers && Array.isArray(spec.servers)) {
                const currentOriginApi = window.location.origin + '/api';
                const stagingApi = 'https://staging-codebridge-api.servicefixit.me/api';
                
                const prioritized = [];
                
                // Prioritize Current Host (Same Origin - zero CORS issues)
                prioritized.push({
                  url: currentOriginApi,
                  description: 'Current Host (' + window.location.host + ')'
                });
                
                // Staging API Gateway
                if (currentOriginApi !== stagingApi) {
                  prioritized.push({
                    url: stagingApi,
                    description: 'Staging API Gateway'
                  });
                }

                // Keep any other servers from spec (excluding duplicate current origin or staging)
                for (const s of spec.servers) {
                  const sUrl = (s.url || '').replace(/\/$/, '');
                  if (sUrl !== currentOriginApi.replace(/\/$/, '') && sUrl !== stagingApi.replace(/\/$/, '')) {
                    prioritized.push(s);
                  }
                }

                spec.servers = prioritized;
                return new Response(JSON.stringify(spec), {
                  status: response.status,
                  statusText: response.statusText,
                  headers: {
                    'content-type': 'application/json; charset=utf-8'
                  }
                });
              }
            } catch (e) {
              console.warn('Could not rewrite OpenAPI spec servers:', e);
            }
          }

          return response;
        };

        function switchService(specUrl) {
          localStorage.setItem('codebridges_selected_doc_spec', specUrl);
          const wrapper = document.getElementById('docsWrapper');
          wrapper.innerHTML = '<elements-api id="elementsDoc" apiDescriptionUrl="' + specUrl + '" router="hash" layout="sidebar"></elements-api>';
        }

        // Restore last selected service if saved
        window.addEventListener('DOMContentLoaded', () => {
          const saved = localStorage.getItem('codebridges_selected_doc_spec');
          if (saved) {
            const select = document.getElementById('serviceSelect');
            if (select && Array.from(select.options).some(opt => opt.value === saved)) {
              select.value = saved;
              switchService(saved);
            }
          }
        });
      </script>
    </body>
    </html>
