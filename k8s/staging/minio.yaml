apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app.kubernetes.io/name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        environment: staging
    spec:
      containers:
        - name: minio
          image: 127.0.0.1:5000/minio/minio:latest
          imagePullPolicy: IfNotPresent
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-provision-buckets
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: minio-provisioner
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-provisioner
        environment: staging
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-mc
          image: 127.0.0.1:5000/minio/mc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO API endpoint on http://minio:9000..."
              until /usr/bin/mc alias set staging http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "MinIO not ready yet, retrying in 2 seconds..."
                sleep 2
              done
              echo "Connected to MinIO API. Provisioning staging buckets..."
              /usr/bin/mc mb --ignore-existing staging/codebridge-auth-staging
              /usr/bin/mc mb --ignore-existing staging/codebridge-operations-staging
              echo "Configuring public download policies on avatar and product assets..."
              /usr/bin/mc anonymous set download staging/codebridge-auth-staging/avatars || true
              /usr/bin/mc anonymous set download staging/codebridge-operations-staging/products || true
              echo "MinIO S3 bucket initialization complete via official API."
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

