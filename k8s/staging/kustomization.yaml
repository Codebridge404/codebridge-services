apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codebridge-staging

labels:
  - pairs:
      app.kubernetes.io/part-of: codebridge
      environment: staging

resources:
  - namespace.yaml
  - secrets.yaml
  - configmaps.yaml
  - mysql.yaml
  - redis.yaml
  - minio.yaml
  - migration-jobs.yaml
  - auth.yaml
  - operations.yaml
  - gateway.yaml
  - ingress.yaml
