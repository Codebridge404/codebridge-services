# Kubernetes Secrets Template for CodeBridge Staging
# IMPORTANT: Copy this file to secrets.yaml and populate with real cryptographically secure credentials.
# Do NOT commit secrets.yaml containing production secrets to public repositories.

apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: codebridge
type: Opaque
stringData:
  APP_KEY: "base64:GENERATE_WITH_PHP_ARTISAN_KEY_GENERATE"
  JWT_SECRET: "MINIMUM_64_CHARACTERS_SECURE_RANDOM_STAGING_SECRET_KEY"
  DB_PASSWORD: "STAGING_AUTH_MYSQL_PASSWORD"
  DB_ROOT_PASSWORD: "STAGING_AUTH_MYSQL_ROOT_PASSWORD"
  REDIS_PASSWORD: "STAGING_AUTH_REDIS_PASSWORD"
  AWS_ACCESS_KEY_ID: "codebridge_staging_admin"
  AWS_SECRET_ACCESS_KEY: "STAGING_MINIO_SECRET_KEY"
  REVERB_APP_KEY: "staging-reverb-public-key"
  REVERB_APP_SECRET: "staging-reverb-secret-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: operations-secrets
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: operations-service
    app.kubernetes.io/part-of: codebridge
type: Opaque
stringData:
  APP_KEY: "base64:GENERATE_WITH_PHP_ARTISAN_KEY_GENERATE"
  JWT_SECRET: "MINIMUM_64_CHARACTERS_SECURE_RANDOM_STAGING_SECRET_KEY"
  DB_PASSWORD: "STAGING_OPS_MYSQL_PASSWORD"
  DB_ROOT_PASSWORD: "STAGING_OPS_MYSQL_ROOT_PASSWORD"
  REDIS_PASSWORD: "STAGING_OPS_REDIS_PASSWORD"
  AWS_ACCESS_KEY_ID: "codebridge_staging_admin"
  AWS_SECRET_ACCESS_KEY: "STAGING_MINIO_SECRET_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: codebridge
type: Opaque
stringData:
  MINIO_ROOT_USER: "codebridge_staging_admin"
  MINIO_ROOT_PASSWORD: "STAGING_MINIO_SECRET_KEY"

