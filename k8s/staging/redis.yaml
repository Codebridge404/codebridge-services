apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-redis-pvc
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-redis
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: auth-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-redis
  namespace: codebridge-staging
  labels:
    app.kubernetes.io/name: auth-redis
    app.kubernetes.io/part-of: codebridge
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-redis
        environment: staging
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "exec redis-server --requirepass \"${REDIS_PASSWORD}\" --appendonly yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "${REDIS_PASSWORD}" ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "${REDIS_PASSWORD}" ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: auth-redis-pvc
---
