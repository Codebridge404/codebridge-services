events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile        on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    fastcgi_read_timeout 180s;
    fastcgi_send_timeout 180s;
    client_max_body_size 64M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    absolute_redirect off;
    port_in_redirect off;

    # Upstream Microservice Definitions (PHP-FPM 9000)
    upstream auth_service {
        server auth-service:9000;
    }

    upstream operations_service {
        server operations-service:9000;
    }

    # ==============================================================================
    # Trusted Proxies & Real IP Configuration
    # Client -> Cloudflare -> NPM -> Gateway -> Laravel PHP-FPM
    # ==============================================================================
    # Cloudflare IPv4 ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # Internal Docker & Private Subnets (NPM and Bridge Networks)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ==============================================================================
    # WAF & Security Layer: Attacker Scanner & Exploit Tools Blocker
    # Blocks tools used in Mass Account Takeovers, GraphQL abuse, & credential stuffing
    # ==============================================================================
    map $http_user_agent $bad_client {
        default 0;
        # Automated scanners & brute-force tools
        ~*(?i)(sqlmap|nikto|gobuster|dirbuster|ffuf|wpscan|masscan|zgrab|hydra|medusa) 1;
        # GraphQL exploit tools (CrackQL, BatchQL, GraphQLmap, Clairvoyance, InQL)
        ~*(?i)(crackql|batchql|graphqlmap|clairvoyance|inql) 1;
        # Automated vulnerability assessment bots
        ~*(?i)(acunetix|nessus|openvas|qualys|netsparker|burpcollaborator) 1;
    }

    # Rate Limiting & Concurrency Zones (Leaky Bucket)
    # Auth limit: 5 requests/sec per IP with burst protection
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # General API limit: 50 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # Connection limit: max 15 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # HTTPS scheme detection behind Traefik & Cloudflare reverse proxies
    map $http_x_forwarded_proto $fastcgi_https {
        default $https;
        https   on;
    }

    map $fastcgi_https $hsts_header {
        default "";
        "on"    "max-age=31536000; includeSubDomains";
    }

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ==============================================================================
    # Client Identification Layer: Enforce X-App-Key on API Routes
    # ==============================================================================
    map "$http_x_app_key:$http_x_client_key" $has_app_key {
        default 1;
        ":"     0;
    }

    map $uri $is_api_route {
        default 0;
        ~*^/api/ 1;
        ~*^/v1/  1;
    }

    map $uri $is_exempt_api {
        default 0;
        ~*^/api/v1/health$ 1;
        ~*^/health$ 1;
        ~*^/up$ 1;
        ~*^/docs 1;
        ~*^/sanctum/csrf-cookie$ 1;
        ~*^/api/v1/auth/email/verify/ 1;
        ~*^/api/v1/payment-callbacks 1;
        ~*^/api/v1/payments/webhook 1;
        ~*^/api/v1/payments/callback 1;
        ~*^/api/v1/reconciliation 1;
    }

    map "$is_api_route:$is_exempt_api:$request_method:$has_app_key" $app_key_block {
        default 0;
        "1:0:GET:0"     1;
        "1:0:POST:0"    1;
        "1:0:PUT:0"     1;
        "1:0:PATCH:0"   1;
        "1:0:DELETE:0"  1;
        "1:0:HEAD:0"    1;
    }

    # ==============================================================================
    # Default Server Block: Reject direct IP access and unknown/spoofed domains
    # Closes plain HTTP connections (444) and aborts SSL handshakes without valid SNI
    # ==============================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1 gateway api-gateway codebridge-api-gateway codebridge-staging-gateway codebridge-api.servicefixit.me staging-codebridge-api.servicefixit.me codebridge-docs.servicefixit.me staging-codebridge-docs.servicefixit.me *.servicefixit.me;

        # Hardened Security Headers & Request Traceability
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Request-ID $req_id always;

        # Redirect docs subdomains root directly to interactive API docs
        if ($host ~* "^(staging-)?codebridge-docs\.servicefixit\.me$") {
            rewrite ^/$ /docs/api redirect;
        }

        # 1. Block Known Attacker Tools & Vulnerability Scanners
        if ($bad_client = 1) {
            return 403 '{"status":"error","code":"SECURITY_WAF_BLOCKED","message":"Access Denied: Malicious scanner or exploit tool signature detected."}\n';
        }

        # 2. Block GraphQL Probes & Mass ATO Batching Endpoints
        location ~* ^/(graphql|graphiql|altair|playground|__graphql|api/graphql)(\/|$) {
            default_type application/json;
            return 403 '{"status":"error","code":"GRAPHQL_ATO_PROTECTED","message":"GraphQL introspection and batch query endpoints are strictly disabled to prevent Mass Account Takeover."}\n';
        }

        # 3. Block PHP2Shell (CVE-2026-109618 / CVE-2026-109619) Exploit Payloads
        if ($query_string ~* "(PHP_SESSION_UPLOAD_PROGRESS|session\.upload_progress|upload_progress_)") {
            return 403 '{"status":"error","code":"PHP2SHELL_EXPLOIT_BLOCKED","message":"Access Denied: PHP2Shell exploit signature detected and blocked."}\n';
        }

        # 4. Block Direct WebShell & Backup Script Probes
        location ~* \.(php_bak|bak|old|orig|save|swp|sh|bash|env)$ {
            deny all;
            return 404;
        }

        # 5. Enforce X-App-Key across all Microservice APIs
        if ($app_key_block = 1) {
            return 401 '{"code":"APP_KEY_REQUIRED","message":"A valid X-App-Key header is required."}\n';
        }

        # Backward-compatible alias: rewrite /v1/... to /api/v1/...
        location /v1/ {
            rewrite ^/v1/(.*)$ /api/v1/$1 last;
        }

        # Gateway Root Index
        location = / {
            add_header Access-Control-Allow-Origin * always;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","system":"CodeBridge Multi-Tenant Platform","environment":"staging","docs":"/docs/api","auth_docs":"/docs/auth","operations_docs":"/docs/operations","health":"/api/v1/health"}\n';
        }

        # Modular Service Route Definitions (explicitly exclude fastcgi_php.conf snippet)
        include /etc/nginx/services/auth-service.conf;
        include /etc/nginx/services/operations-service.conf;
        include /etc/nginx/services/docs.conf;

        # Gateway Health Check Endpoints
        location = /health {
            add_header Access-Control-Allow-Origin * always;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","security":"waf_active","system":"CodeBridge@ Multi-Tenant Enterprise Platform"}';
        }

        location = /api/v1/health {
            add_header Access-Control-Allow-Origin * always;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","security":"waf_active","system":"CodeBridge@ Multi-Tenant Enterprise Platform"}';
        }
    }
}
