events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 64M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream Microservice Definitions (PHP-FPM 9000)
    upstream auth_service {
        server auth-service:9000;
    }

    upstream operations_service {
        server operations-service:9000;
    }

    # ==============================================================================
    # Trusted Proxies & Real IP Configuration
    # Client -> Cloudflare -> NPM -> Gateway -> Laravel PHP-FPM
    # ==============================================================================
    # Cloudflare IPv4 ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # Internal Docker & Private Subnets (NPM and Bridge Networks)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ==============================================================================
    # WAF & Security Layer: Attacker Scanner & Exploit Tools Blocker
    # Blocks tools used in Mass Account Takeovers, GraphQL abuse, & credential stuffing
    # ==============================================================================
    map $http_user_agent $bad_client {
        default 0;
        # Automated scanners & brute-force tools
        ~*(?i)(sqlmap|nikto|gobuster|dirbuster|ffuf|wpscan|masscan|zgrab|hydra|medusa) 1;
        # GraphQL exploit tools (CrackQL, BatchQL, GraphQLmap, Clairvoyance, InQL)
        ~*(?i)(crackql|batchql|graphqlmap|clairvoyance|inql) 1;
        # Automated vulnerability assessment bots
        ~*(?i)(acunetix|nessus|openvas|qualys|netsparker|burpcollaborator) 1;
    }

    # Rate Limiting & Concurrency Zones (Leaky Bucket)
    # Auth limit: 5 requests/sec per IP with burst protection
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # General API limit: 50 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # Connection limit: max 15 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name localhost 127.0.0.1 codebridge-api.servicefixit.me staging-codebridge-api.servicefixit.me codebridge-docs.servicefixit.me staging-codebridge-docs.servicefixit.me *.servicefixit.me;

        # Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Redirect docs subdomains root to interactive documentation hub
        if ($host ~* "^(staging-)?codebridge-docs\.servicefixit\.me$") {
            rewrite ^/$ /docs permanent;
        }

        # 1. Block Known Attacker Tools & Vulnerability Scanners
        if ($bad_client = 1) {
            return 403 '{"status":"error","code":"SECURITY_WAF_BLOCKED","message":"Access Denied: Malicious scanner or exploit tool signature detected."}\n';
        }

        # 2. Block GraphQL Probes & Mass ATO Batching Endpoints
        location ~* ^/(graphql|graphiql|altair|playground|__graphql|api/graphql)(\/|$) {
            default_type application/json;
            return 403 '{"status":"error","code":"GRAPHQL_ATO_PROTECTED","message":"GraphQL introspection and batch query endpoints are strictly disabled to prevent Mass Account Takeover."}\n';
        }

        # 3. Block PHP2Shell (CVE-2026-109618 / CVE-2026-109619) Exploit Payloads
        if ($query_string ~* "(PHP_SESSION_UPLOAD_PROGRESS|session\.upload_progress|upload_progress_)") {
            return 403 '{"status":"error","code":"PHP2SHELL_EXPLOIT_BLOCKED","message":"Access Denied: PHP2Shell exploit signature detected and blocked."}\n';
        }

        # 4. Block Direct WebShell & Backup Script Probes
        location ~* \.(php_bak|bak|old|orig|save|swp|sh|bash|env)$ {
            deny all;
            return 404;
        }

        # Backward-compatible alias: rewrite /v1/... to /api/v1/...
        location /v1/ {
            rewrite ^/v1/(.*)$ /api/v1/$1 last;
        }

        # Gateway Root Index
        location = / {
            add_header Access-Control-Allow-Origin * always;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","system":"CodeBridge Multi-Tenant Platform","environment":"staging","docs":"/docs","health":"/api/v1/health"}\n';
        }

        # Modular Service Route Definitions
        include /etc/nginx/services/*.conf;

        # Gateway Health Check Endpoints
        location = /health {
            add_header Access-Control-Allow-Origin * always;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","security":"waf_active","system":"CodeBridge@ Multi-Tenant Enterprise Platform"}';
        }

        location = /api/v1/health {
            add_header Access-Control-Allow-Origin * always;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","security":"waf_active","system":"CodeBridge@ Multi-Tenant Enterprise Platform"}';
        }
    }
}
