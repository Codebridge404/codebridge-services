events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Consolidated Microservices (Operations & Auth)
    upstream auth_service {
        server auth-service:8000;
    }

    upstream operations_service {
        server operations-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # OpenAPI / Swagger Documentation Gateway Routes
        location = /docs {
            alias /usr/share/nginx/html/docs.html;
            default_type text/html;
        }
        location = /docs/ {
            alias /usr/share/nginx/html/docs.html;
            default_type text/html;
        }
        location /docs/api.json {
            proxy_pass http://auth_service/docs/api.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/operations/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Backward-compatible doc endpoints
        location /docs/inventory/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/sales/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/auth {
            proxy_pass http://auth_service/docs/api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/operations {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/catalog {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/inventory {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
