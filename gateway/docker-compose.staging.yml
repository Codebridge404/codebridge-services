services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebridge-staging-gateway
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services:/etc/nginx/services:ro
    networks:
      codebridge-staging-network:
        aliases:
          - api-gateway
          - codebridge-api-gateway
          - codebridge-staging-gateway

networks:
  codebridge-staging-network:
    name: codebridge-staging-network
