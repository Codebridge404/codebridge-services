services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebridge-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services:/etc/nginx/services:ro
    networks:
      - codebridge-network

  docker-telemetry-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: codebridge-docker-telemetry-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      # Strictly READ-ONLY: only container listing & live stats permitted
      CONTAINERS: 1
      POST: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - codebridge-network

networks:
  codebridge-network:
    name: codebridge-network
    external: true
