# ==============================================================================
# Auth & Identity Microservice Routes (PHP-FPM Port 9000 / upstream auth_service)
# Responsibilities: Users, Credentials, RBAC, Multi-tenancy, CRM, Meetings, Outlets
# ==============================================================================

location /api/v1/auth {
    limit_req zone=auth_limit burst=10 nodelay;
    limit_conn conn_limit 10;
    fastcgi_pass auth_service;
    include /etc/nginx/services/fastcgi_php.conf;
}

location /api/v1/me {
    fastcgi_pass auth_service;
    include /etc/nginx/services/fastcgi_php.conf;
}

