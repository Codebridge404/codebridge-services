# ==============================================================================
# Operations Microservice Routes (PHP-FPM Port 9000 / upstream operations_service)
# Responsibilities: Products, Catalog, Inventory, Sales, POS, KHQR, Payments, Finance
# ==============================================================================

# --- Catalog & Products Module ---
location /api/v1/products {
    fastcgi_pass operations_service;
    include /etc/nginx/services/fastcgi_php.conf;
}

