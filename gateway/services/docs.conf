# ==============================================================================
# OpenAPI / Swagger / Scramble Documentation Gateway Routes
# ==============================================================================

# Central Interactive Documentation Hub
location = /docs {
    alias /usr/share/nginx/html/docs.html;
    default_type text/html;
}

location = /docs/ {
    alias /usr/share/nginx/html/docs.html;
    default_type text/html;
}

# ------------------------------------------------------------------------------
# 1. Auth & Identity Service - Scramble Interactive Docs & Spec
# ------------------------------------------------------------------------------
location /docs/api {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_pass auth_service;
}

location = /docs/api.json {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_pass auth_service;
}

location /docs/auth {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api;
    fastcgi_pass auth_service;
}

# ------------------------------------------------------------------------------
# 2. Operations Service - Scramble Interactive Docs & Spec
# ------------------------------------------------------------------------------
location /docs/operations/api.json {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api.json;
    fastcgi_pass operations_service;
}

location /docs/operations {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api;
    fastcgi_pass operations_service;
}

location /docs/inventory {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api;
    fastcgi_pass operations_service;
}

location /docs/sales {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api;
    fastcgi_pass operations_service;
}
