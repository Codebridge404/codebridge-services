# ==============================================================================
# OpenAPI / Swagger / Scramble Documentation Gateway Routes
# ==============================================================================

# Direct Redirect to Auth Scramble UI (no gateway hub page)
location = /docs {
    return 302 /docs/api;
}

location = /docs/ {
    return 302 /docs/api;
}

# ------------------------------------------------------------------------------
# 1. Auth & Identity Service - Scramble Interactive Docs & Spec
# ------------------------------------------------------------------------------
location /docs/api {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_pass auth_service;
}

location = /docs/api.json {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_pass auth_service;
}

location = /docs/auth/api.json {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api.json;
    fastcgi_pass auth_service;
}

location /docs/auth {
    include /etc/nginx/services/fastcgi_php.conf;
    fastcgi_param REQUEST_URI /docs/api;
    fastcgi_pass auth_service;
}

