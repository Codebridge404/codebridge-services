services:

  # 1. MinIO S3-Compatible Object Storage Service
  minio:
    image: minio/minio:latest
    container_name: codebridge-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # MinIO S3 API Endpoint
      - "9001:9001"   # MinIO Web Console Dashboard
    volumes:
      - minio-data:/data
    networks:
      codebridge-network:
        aliases:
          - minio
          - s3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. MinIO Automated Bucket Initializer
  minio-init:
    image: alpine:latest
    container_name: codebridge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - minio-data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/codebridge-auth/avatars /data/codebridge-operations/products
        chmod -R 777 /data
        echo 'MinIO buckets initialized successfully.'
        exit 0
    networks:
      - codebridge-network

networks:
  codebridge-network:
    name: codebridge-network
    external: true

volumes:
  minio-data: