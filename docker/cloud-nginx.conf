events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile        on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_max_body_size 64M;

    # Trust private reverse proxies & expose Request ID
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Internal Upstreams (Consolidated Microservices in Unified Container)
    upstream auth_service {
        server 127.0.0.1:8001;
    }

    upstream operations_service {
        server 127.0.0.1:8003;
    }

    # ==============================================================================
    # Default Server Block: Reject direct IP access and unknown/spoofed domains
    # ==============================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1 codebridge-api.servicefixit.me staging-codebridge-api.servicefixit.me codebridge-docs.servicefixit.me staging-codebridge-docs.servicefixit.me *.servicefixit.me;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $req_id always;

        # Health check endpoint
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","gateway":"CodeBridges Cloud API Gateway"}';
        }

        # OpenAPI / Swagger Interactive Documentation Gateway Routes
        location = /docs {
            return 302 /docs/api;
        }
        location = /docs/ {
            return 302 /docs/api;
        }
        location /docs/api {
            proxy_pass http://auth_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /docs/api.json {
            proxy_pass http://auth_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /docs/operations/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /docs/operations-service/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /docs/auth/api.json {
            proxy_pass http://auth_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        # Backward-compatible doc routes
        location /docs/inventory/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /docs/sales/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
