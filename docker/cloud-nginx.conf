events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Internal Upstreams (Consolidated Microservices in Unified Container)
    upstream auth_service {
        server 127.0.0.1:8001;
    }

    upstream operations_service {
        server 127.0.0.1:8003;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","gateway":"CodeBridges Cloud API Gateway"}';
        }

        # OpenAPI / Swagger Interactive Documentation Gateway Routes
        location = /docs {
            alias /usr/share/nginx/html/docs.html;
            default_type text/html;
        }
        location = /docs/ {
            alias /usr/share/nginx/html/docs.html;
            default_type text/html;
        }
        location /docs/api {
            proxy_pass http://auth_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /docs/api.json {
            proxy_pass http://auth_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /docs/operations/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        # Backward-compatible doc routes
        location /docs/inventory/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /docs/sales/api.json {
            proxy_pass http://operations_service/docs/api.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /vendor/scramble {
            proxy_pass http://auth_service/vendor/scramble;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/auth {
            proxy_pass http://auth_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/operations {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/catalog {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/inventory {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/sales {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/payment {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /docs/shift {
            proxy_pass http://operations_service/docs/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backward-compatible alias: rewrite /v1/... to /api/v1/...
        location /v1/ {
            rewrite ^/v1/(.*)$ /api/v1/$1 last;
        }

        # 1. Auth & Identity Service Routes
        location /api/v1/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept "application/json";
        }
        location /api/v1/me {
