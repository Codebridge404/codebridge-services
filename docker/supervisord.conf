[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:auth-service]
directory=/var/www/auth-service
command=php artisan serve --host=127.0.0.1 --port=8001
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:operations-service]
directory=/var/www/operations-service
command=php artisan serve --host=127.0.0.1 --port=8003
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:auth-horizon]
directory=/var/www/auth-service
command=/bin/sh -c 'if grep -q "^QUEUE_CONNECTION=redis" .env 2>/dev/null && php artisan list | grep -q "horizon"; then exec php artisan horizon; elif grep -q "^QUEUE_CONNECTION=sync" .env 2>/dev/null; then exec sleep 3600; else exec php artisan queue:work --queue=default,notifications --tries=3 --timeout=90 --sleep=3; fi'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:operations-horizon]
directory=/var/www/operations-service
command=/bin/sh -c 'if grep -q "^QUEUE_CONNECTION=redis" .env 2>/dev/null && php artisan list | grep -q "horizon"; then exec php artisan horizon; elif grep -q "^QUEUE_CONNECTION=sync" .env 2>/dev/null; then exec sleep 3600; else exec php artisan queue:work --queue=default,notifications,exports --tries=3 --timeout=90 --sleep=3; fi'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
