services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:2.16.0'
    container_name: codebridge-nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'       # Public HTTP Traffic
      - '81:81'       # Admin Web Management Dashboard
      - '443:443'     # Public HTTPS Traffic (Let's Encrypt SSL)
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - codebridge-network

networks:
  codebridge-network:
    name: codebridge-network
    external: true

