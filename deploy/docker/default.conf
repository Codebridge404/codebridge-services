map $http_x_forwarded_proto $app_https {
    default off;
    https on;
}
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 34m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /nginx-health { access_log off; return 200 'ok'; }
    # Probe PHP-FPM without depending on the database or Laravel middleware.
    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    # Only expected raster images are public; no executable/active uploads.
    location ~* ^/storage/(.+\.(?:jpg|jpeg|png|gif|webp|avif|ico))$ {
        alias /var/www/html/storage/app/public/$1;
    }
    location /storage/ { return 404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # Ingress only accepts HTTPS; direct HTTP access is for local diagnostics.
        fastcgi_param HTTPS $app_https;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 70s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
